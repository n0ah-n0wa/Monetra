name: CI

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff check and format
        run: |
          ruff check app tests
          ruff format --check app tests

  backend-typecheck:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy app

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monetra_test
          POSTGRES_USER: monetra
          POSTGRES_PASSWORD: monetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monetra -d monetra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://monetra:monetra@localhost:5432/monetra_test
      JWT_SECRET_KEY: test-secret-key-must-be-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Migrate test database
        run: alembic upgrade head
      - name: Pytest
        run: pytest

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint and Prettier
        run: |
          npm run lint
          npm run format:check

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npm run test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development Compose images
        run: docker compose build
      - name: Build production images
        run: |
          docker build -t monetra-backend:ci ./backend --target production
          docker build -t monetra-frontend:ci ./frontend --target production
          docker build -t monetra-nginx:ci ./nginx --target production
          docker compose -f docker-compose.prod.yml build
      - name: Verify production containers run as non-root
        run: |
          backend_uid="$(docker run --rm --entrypoint id monetra-backend:ci -u)"
          frontend_uid="$(docker run --rm --entrypoint id monetra-frontend:ci -u)"
          nginx_uid="$(docker run --rm --entrypoint su-exec monetra-nginx:ci nginx id -u)"
          if [ "$backend_uid" = "0" ]; then
            echo "Backend production image must not run as root"
            exit 1
          fi
          if [ "$frontend_uid" = "0" ]; then
            echo "Frontend production image must not run as root"
            exit 1
          fi
          if [ "$nginx_uid" = "0" ]; then
            echo "Nginx production image must not run worker processes as root"
            exit 1
          fi
          echo "Backend UID: $backend_uid, Frontend UID: $frontend_uid, Nginx UID: $nginx_uid"
      - name: Verify no secrets in image env
        run: |
          if docker run --rm --entrypoint env monetra-backend:ci | grep -E 'JWT_SECRET_KEY=change-me'; then
            echo "Default JWT secret must not be baked into the image"
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monetra_e2e
          POSTGRES_USER: monetra
          POSTGRES_PASSWORD: monetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monetra -d monetra_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://monetra:monetra@localhost:5432/monetra_e2e
      JWT_SECRET_KEY: test-secret-key-must-be-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      AUTH_RATE_LIMIT_MAX_REQUESTS: 1000
      VITE_PROXY_TARGET: http://127.0.0.1:8000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Migrate E2E database
        working-directory: backend
        run: alembic upgrade head
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
      - name: Run Playwright E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-typecheck
      - backend-test
      - frontend-lint
      - frontend-typecheck
      - frontend-test
      - frontend-build
      - docker
      - e2e
    steps:
      - name: All quality checks passed
        run: echo "Lint, typecheck, tests, production build, Docker builds, and E2E checks succeeded."
