name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monetra_test
          POSTGRES_USER: monetra
          POSTGRES_PASSWORD: monetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monetra -d monetra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://monetra:monetra@localhost:5432/monetra_test
      JWT_SECRET_KEY: test-secret-key-must-be-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Migrate test database
        run: alembic upgrade head
      - name: Lint
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Typecheck
        run: mypy app
      - name: Test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker compose build
          docker build -t monetra-backend:ci ./backend --target production
          docker build -t monetra-frontend:ci ./frontend --target production
      - name: Verify production containers run as non-root
        run: |
          backend_uid="$(docker run --rm monetra-backend:ci id -u)"
          frontend_uid="$(docker run --rm monetra-frontend:ci id -u)"
          if [ "$backend_uid" = "0" ]; then
            echo "Backend production image must not run as root"
            exit 1
          fi
          if [ "$frontend_uid" = "0" ]; then
            echo "Frontend production image must not run as root"
            exit 1
          fi
          echo "Backend UID: $backend_uid, Frontend UID: $frontend_uid"
      - name: Verify no secrets in image env
        run: |
          if docker run --rm monetra-backend:ci env | grep -E 'JWT_SECRET_KEY=change-me'; then
            echo "Default JWT secret must not be baked into the image"
            exit 1
          fi

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: monetra_e2e
          POSTGRES_USER: monetra
          POSTGRES_PASSWORD: monetra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monetra -d monetra_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://monetra:monetra@localhost:5432/monetra_e2e
      JWT_SECRET_KEY: test-secret-key-must-be-at-least-32-chars
      CORS_ORIGINS: http://localhost:5173
      PLAYWRIGHT_BASE_URL: http://localhost:5173
      AUTH_RATE_LIMIT_MAX_REQUESTS: 1000
      VITE_PROXY_TARGET: http://127.0.0.1:8000
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Migrate E2E database
        working-directory: backend
        run: alembic upgrade head
      - name: Install frontend dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          exit 1
      - name: Run Playwright E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
