name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: true
        default: main
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: quality
    environment: production
    timeout-minutes: 45
    steps:
      - name: Require deployment secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_PRIVATE_KEY PRODUCTION_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Resolve deploy ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_REF: ${{ steps.ref.outputs.value }}
        run: |
          target_path="${DEPLOY_PATH:-/opt/monetra}"
          ssh "${EC2_USER}@${EC2_HOST}" bash -s <<EOF
          set -euo pipefail
          cd "${target_path}"
          git fetch origin --tags --prune
          git checkout "${DEPLOY_REF}"
          chmod +x scripts/*.sh
          ./scripts/deploy-production.sh --skip-fetch "${DEPLOY_REF}"
          EOF

      - name: Public smoke tests
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          chmod +x scripts/smoke-production.sh
          ./scripts/smoke-production.sh "${PRODUCTION_URL}"

      - name: Deployment summary
        if: success()
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          DEPLOY_REF: ${{ steps.ref.outputs.value }}
        run: |
          {
            echo "## Production deployment succeeded"
            echo ""
            echo "- Ref: \`${DEPLOY_REF}\`"
            echo "- URL: ${PRODUCTION_URL}"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deployment failed
        if: failure()
        run: |
          {
            echo "## Production deployment failed"
            echo ""
            echo "The deploy workflow stopped before all health and smoke checks passed."
            echo "Inspect the EC2 host logs:"
            echo ""
            echo '```bash'
            echo "ssh <user>@<host> 'cd /opt/monetra && docker compose -f docker-compose.prod.yml ps'"
            echo "ssh <user>@<host> 'cd /opt/monetra && docker compose -f docker-compose.prod.yml logs --tail=200'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
