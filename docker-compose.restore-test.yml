# Isolated PostgreSQL instance for non-production backup/restore drills.
# Exposes port 5433 on the host; never use in production.
services:
  postgres-restore:
    image: postgres:16-alpine
    container_name: monetra-postgres-restore-test
    environment:
      POSTGRES_DB: ${POSTGRES_RESTORE_DB:-monetra_restore}
      POSTGRES_USER: ${POSTGRES_USER:-monetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monetra-restore-test}
    ports:
      - "${POSTGRES_RESTORE_PORT:-5433}:5432"
    volumes:
      - postgres_restore_test:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-monetra} -d ${POSTGRES_RESTORE_DB:-monetra_restore}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monetra_restore_test
      - monetra

volumes:
  postgres_restore_test:

networks:
  monetra_restore_test:
    driver: bridge
  monetra:
    external: true
    name: monetra_monetra
