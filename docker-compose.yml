services:
  postgres:
    image: postgres:16-alpine
    container_name: monetra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monetra}
      POSTGRES_USER: ${POSTGRES_USER:-monetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monetra}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monetra} -d ${POSTGRES_DB:-monetra}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - monetra

  backend:
    build:
      context: ./backend
      target: development
    container_name: monetra-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-monetra}:${POSTGRES_PASSWORD:-monetra}@postgres:5432/${POSTGRES_DB:-monetra}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-1000}
    volumes:
      - ./backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - monetra

  # Optional fully-containerized Vite service (Linux CI / environments with
  # reliable npm TLS). Enable with: docker compose --profile frontend up
  frontend:
    profiles: ["frontend"]
    image: node:22-bookworm-slim
    container_name: monetra-frontend
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -x node_modules/.bin/vite ]; then
          npm install --no-fund --no-audit
        fi
        exec npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - monetra

  nginx:
    image: nginx:1.27-alpine
    container_name: monetra-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - monetra

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  monetra:
    driver: bridge
